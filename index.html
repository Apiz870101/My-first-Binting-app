<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pengembaraan Bintang</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen app shell. Slim HUD on top, one full-height screen below.
   The winding road map is home base; every task is a chunky white card on a pastel backdrop of the place's colour.
   Deliberately a single bright look (a children's game), so every colour is set explicitly. */
:root{
  --bg:#e3f3ff;
  --ink:#2a2150;
  --card:#ffffff;
  --pink:#f0348a;
  --pink-d:#a3185e;
  --purple:#8450f0;
  --purple-d:#5a32b8;
  --sun:#ffc533;
  --mint:#0f9d76;
  --mint-d:#0a6b50;
  --sky:#3fb0ff;
  --line:#d8e2f0;
  --muted:#5f5a85;
  --place:#ffe2a8;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(180deg,#bfe4ff 0,#e3f3ff 45%,#f3fbff 100%);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:18px;
  line-height:1.35;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;
}
input{user-select:text;-webkit-user-select:text}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
.emoji{font-family:var(--font-emoji);font-style:normal}

#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* ---------- HUD ---------- */
#hud{flex:none;display:grid;grid-template-columns:44px 1fr 44px;grid-template-areas:"h m s" "st st st";align-items:center;gap:4px 8px;
  background:var(--card);border-radius:22px;padding:6px 8px 8px;box-shadow:0 4px 0 var(--line)}
#homeBtn{grid-area:h}#sndBtn{grid-area:s}
.me{grid-area:m;display:flex;align-items:center;gap:8px;min-width:0}
.hav{flex:none;width:36px;height:36px;border-radius:50%;background:#efe9ff;overflow:hidden;display:block}
.hav svg{width:100%;height:100%;display:block}
.hname{font:800 1.15rem var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstars{grid-area:st;display:flex;justify-content:center;gap:3px}
.hstars svg{width:22px;height:22px;flex:none}
.ib{width:44px;height:44px;border:0;border-radius:14px;background:#f1edff;color:var(--purple-d);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.ib svg{width:24px;height:24px}
.ib:focus-visible,.btn:focus-visible,.choice:focus-visible,.chip:focus-visible,.sw:focus-visible,.w:focus-visible,.gift:focus-visible,.tbtn:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

/* ---------- screen container ---------- */
#screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;border-radius:28px;background:var(--card);box-shadow:0 5px 0 var(--line);scroll-behavior:auto;position:relative}
#screen[data-view="map"]{background:transparent;box-shadow:none}

.pane{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 18px 26px;text-align:center}
.pane h2{font:800 1.9rem/1.1 var(--font-display)}
.pane p{color:var(--muted);font-weight:700}

/* ---------- buttons ---------- */
.btn{--btn:var(--pink);--btn-d:var(--pink-d);font:800 1.2rem var(--font-display);min-height:56px;padding:10px 26px;border:0;border-radius:18px;background:var(--btn);color:#fff;
  box-shadow:0 5px 0 var(--btn-d);cursor:pointer;touch-action:manipulation;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--btn-d)}
.btn:disabled{--btn:#c9c4de;--btn-d:#a7a1c4;cursor:not-allowed}
.btn.mint{--btn:var(--mint);--btn-d:var(--mint-d)}
.btn.purple{--btn:var(--purple);--btn-d:var(--purple-d)}
.btn.ghost{--btn:#fff;--btn-d:var(--line);color:var(--ink);border:2px solid var(--line)}
.btn.big{min-width:min(100%,280px);font-size:1.4rem;min-height:62px}
.btn.sm{min-height:48px;padding:6px 18px;font-size:1.05rem}
.btn svg{width:22px;height:22px;flex:none}

/* ---------- title ---------- */
.title h1{font:800 clamp(2.2rem,10vw,3.1rem)/1 var(--font-display);display:flex;flex-direction:column;align-items:center}
.title h1 span{font-size:.6em;color:var(--ink)}
.title h1 b{color:var(--pink);text-shadow:0 4px 0 var(--pink-d)}
.mascot svg{width:128px;height:128px;display:block;animation:bounce 2.4s ease-in-out infinite}
.lbl{font:800 1.2rem var(--font-display)}
.name-in{font:800 1.5rem var(--font-display);width:min(100%,320px);padding:12px 16px;border-radius:18px;border:3px solid var(--line);text-align:center;color:var(--ink);background:#fff}
.name-in:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px #e3d8ff}
.name-in.bad{border-color:var(--pink);animation:shake .35s}
.hello{display:flex;align-items:center;gap:14px;background:#f4f0ff;border-radius:22px;padding:10px 18px 10px 12px;text-align:left}
.hello svg{height:104px;width:auto;display:block;background:#e6dcff;border-radius:18px;padding:4px 6px}
.hello p{font:700 1.15rem/1.3 var(--font-body);color:var(--ink)}
.coll{display:flex;flex-direction:column;gap:6px;align-items:center}
.coll h2{font:800 1.1rem var(--font-display);color:var(--muted)}
.grow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mini-gift{width:52px;height:52px;border-radius:16px;background:#fff6d6;display:grid;place-items:center;font-size:1.9rem}
.mini-gift svg{width:36px;height:36px}
.note{font-size:.9rem;font-weight:700;color:var(--muted)}

/* ---------- creator ---------- */
.creator{flex:1;min-height:0;display:flex;flex-direction:column}
.prev{flex:none;height:min(34vh,250px);background:radial-gradient(circle at 50% 70%,#fff 0,#e6dcff 70%);display:flex;align-items:center;justify-content:center;border-radius:28px 28px 0 0}
.prev svg{height:92%;width:auto;display:block}
.opts{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 4px;display:flex;flex-direction:column;gap:14px}
.opts section{display:flex;flex-direction:column;gap:8px}
.opts h3{font:800 1.2rem var(--font-display)}
.opts h4{font:800 .95rem var(--font-body);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font:800 1rem var(--font-body);cursor:pointer;touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.sw{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;touch-action:manipulation;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.dock{flex:none;display:flex;justify-content:center;padding:10px 16px 14px;background:var(--card)}

/* ---------- map ---------- */
.mapwrap{flex:none}
#mapsvg{display:block;width:100%;height:auto;border-radius:28px}
.rd1{fill:none;stroke:#a97c48;stroke-width:34;stroke-linecap:round}
.rd2{fill:none;stroke:#ecd0a0;stroke-width:27;stroke-linecap:round}
.rd3{fill:none;stroke:#fff;stroke-width:2.6;stroke-dasharray:7 8;stroke-linecap:round}
.rd3.gold{stroke:#ffb300;stroke-width:3.4}
.node .lbl text{font-family:var(--font-body)}
.node.lock .nc{opacity:.6}
.node.lock .ni{opacity:.45}
.pulse{fill:none;stroke:var(--pink);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:pulse 1.3s ease-out infinite}
.ni{font-family:var(--font-emoji)}
.walking .bob{animation:hop .34s ease-in-out infinite}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:#fff;font:800 1.15rem var(--font-display);padding:12px 22px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.18);text-align:center;z-index:5;animation:pop .25s ease-out}

/* ---------- task ---------- */
.task{flex:1 0 auto;display:flex;flex-direction:column;gap:12px;padding:14px 14px 0;background:var(--place)}
.banner{display:flex;align-items:center;gap:12px}
.pi{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2rem;font-family:var(--font-emoji);box-shadow:0 3px 0 rgba(42,33,80,.15)}
.pn{font:800 1.4rem/1.05 var(--font-display)}
.pt{font-weight:800;color:var(--ink);opacity:.8}
.pips{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.pips li{flex:1;text-align:center;font-size:.82rem;font-weight:800;opacity:.75}
.pips li::before{content:"";display:block;height:10px;border-radius:6px;background:rgba(255,255,255,.7);margin-bottom:3px}
.pips li.done::before{background:var(--purple)}
.pips li.cur::before{background:var(--pink)}
.pips li.cur{opacity:1}
.card{background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 0 rgba(42,33,80,.12);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.sent{font:800 1.65rem/2.05 var(--font-body)}
.w{font:inherit;border:0;background:#f1ecff;border-radius:12px;padding:0 9px;margin:0 1px;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.w.on{background:var(--sun)}
.hint{font-weight:700;font-size:.95rem;color:var(--ink);opacity:.8}
.task .dock{position:sticky;bottom:0;margin-top:auto;background:var(--place);padding:10px 0 14px}
.q{font:700 1.55rem/1.6 var(--font-body)}
.blank{display:inline-block;min-width:3.4em;border-bottom:4px dashed var(--purple);text-align:center;color:var(--purple);font-weight:800;margin:0 4px}
.blank.filled{border-bottom-style:solid;color:var(--mint)}
.choices{display:grid;grid-template-columns:1fr;gap:10px}
.choices.nums{grid-template-columns:repeat(3,1fr)}
.choice{min-height:64px;padding:8px 12px;border-radius:20px;border:0;background:#fff;box-shadow:0 5px 0 rgba(42,33,80,.18);font:800 1.5rem var(--font-display);cursor:pointer;touch-action:manipulation;transition:transform .08s}
.choice:active:not(:disabled){transform:translateY(4px)}
.choice.ok{background:#d4f6e6;box-shadow:0 5px 0 var(--mint)}
.choice.bad{background:#ffdce6;box-shadow:0 5px 0 var(--pink);animation:shake .35s;opacity:.7}
.choice:disabled:not(.ok):not(.bad){opacity:.55}
.fb{min-height:1.8em;font:800 1.3rem var(--font-display);text-align:center}
.fb.good{color:var(--mint-d)}
.fb.try{color:var(--pink-d)}
.diagram{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;width:100%}
.grp{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;background:#f4f0ff;border-radius:18px;padding:8px 10px;max-width:100%}
.em{font:2rem/1.15 var(--font-emoji);position:relative;display:inline-block}
.em.gone i{opacity:.28;filter:grayscale(1);font-style:normal}
.em.gone b{position:absolute;inset:0;display:grid;place-items:center;color:#e11d48;font:800 1.7rem var(--font-display)}
.op{font:800 2.2rem var(--font-display);color:var(--purple)}
.eq{font:800 2.2rem var(--font-display);text-align:center;width:100%;letter-spacing:.04em}
.qrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;width:100%}
.qrow .q{font-size:1.35rem;line-height:1.5}
.prompt{font:700 1.2rem/1.4 var(--font-body)}
.canvas-wrap{background:#fff radial-gradient(#ebe6fa 1.2px,transparent 1.6px) 0 0/22px 22px;border-radius:22px;box-shadow:0 4px 0 rgba(42,33,80,.15);overflow:hidden;touch-action:none}
#cv{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.tools{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:20px;padding:10px;align-items:center}
.palette{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.palette .sw{width:40px;height:40px}
.trow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tbtn{min-height:44px;padding:4px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;font:800 .95rem var(--font-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
.tbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tbtn i{display:block;border-radius:50%;background:currentColor}

.lv{margin-left:auto;flex:none;background:#fff;border-radius:999px;padding:4px 12px;font:800 .9rem var(--font-display);box-shadow:0 3px 0 rgba(42,33,80,.12);white-space:nowrap}
.times{font:800 1.5rem var(--font-display);align-self:center;margin-left:4px;white-space:nowrap}
/* ---------- star / finish ---------- */
.star-pane{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff7d6,#fff)}
.star-pane>*{position:relative;z-index:1}
.bigstar svg{width:170px;height:170px;display:block;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.conf{position:absolute!important;inset:0;z-index:0!important;pointer-events:none}
.conf i{position:absolute;top:-8%;left:var(--x);width:16px;height:16px;background:var(--c);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:fall var(--d) linear var(--dl) infinite}
.pbar{display:flex;gap:4px}
.pbar svg{width:24px;height:24px}
.congrats{position:relative;flex:1 0 auto;display:flex;background:linear-gradient(180deg,#2a2150,#4a2f8f)}
.fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cg-body{position:relative;z-index:1;margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 18px;text-align:center;color:#fff;max-width:300px}
.cg-body h2{font:800 2.2rem/1.05 var(--font-display);color:var(--sun);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.cg-body p{font-weight:700;color:#efe9ff}
.cg-body .dance{height:170px;width:auto;animation:sway 1.2s ease-in-out infinite;transform-origin:50% 100%}
.gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.gift{border:3px solid var(--line);background:#fff;border-radius:22px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation;font:800 1rem var(--font-body);color:var(--ink)}
.gift[aria-pressed="true"]{border-color:var(--pink);background:#fff0f7;box-shadow:0 0 0 3px #ffd0e5}
.gift:last-child:nth-child(odd){grid-column:1/-1;width:calc(50% - 6px);justify-self:center}
.ga{height:68px;display:grid;place-items:center}
.ga .emoji{font-size:3.2rem}
.ga svg{width:64px;height:64px}
.reveal .glow{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#fff6c4 0,#ffe27a 55%,transparent 72%);display:grid;place-items:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.reveal .glow .emoji{font-size:6.5rem}
.reveal .glow svg{width:120px;height:120px}

/* ---------- motion ---------- */
@keyframes bounce{50%{transform:translateY(-8px)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{from{transform:scale(.8);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes hop{50%{transform:translateY(-4px)}}
@keyframes fall{to{top:104%;transform:rotate(300deg)}}
@keyframes sway{50%{transform:rotate(4deg)}0%,100%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header id="hud" hidden>
    <button class="ib" id="homeBtn" type="button" aria-label="Ke menu utama"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 3l9 8.5V21h-6.5v-6h-5v6H3z" fill="currentColor"/></svg></button>
    <div class="me"><span class="hav" id="hudAv"></span><span class="hname" id="hudName"></span></div>
    <button class="ib" id="sndBtn" type="button" aria-label="Bunyi"></button>
    <div class="hstars" id="hudStars" role="img"></div>
  </header>
  <main id="screen" data-view="title"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var rand=function(n){return Math.floor(Math.random()*n)};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rand(i+1),t=a[i];a[i]=a[j];a[j]=t}return a};
var reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function shade(hex,amt){
  var n=parseInt(hex.replace('#',''),16),r=n>>16,g=(n>>8)&255,b=n&255;
  var f=function(v){return Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)))};
  return '#'+[f(r),f(g),f(b)].map(function(v){return ('0'+v.toString(16)).slice(-2)}).join('');
}
function starPoints(cx,cy,R,r){
  var p=[];for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;p.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1))}
  return p.join(' ');
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= data ================= */
var SKINS=[{c:'#ffe0c7',n:'Kulit cerah'},{c:'#f6c8a0',n:'Kulit cerah sederhana'},{c:'#e3a87a',n:'Kulit sawo matang cerah'},{c:'#c98557',n:'Kulit sawo matang'},{c:'#a0653c',n:'Kulit coklat'},{c:'#744327',n:'Kulit coklat tua'}];
var HAIRC=[{c:'#2a2020',n:'Hitam'},{c:'#6b4226',n:'Coklat'},{c:'#e8b64a',n:'Kuning'},{c:'#ff5fa8',n:'Pink'},{c:'#8e5bf5',n:'Purple'},{c:'#3a8dff',n:'Biru'},{c:'#ee3b3b',n:'Merah'}];
var COLORS=[{c:'#ff5fa8',n:'Pink'},{c:'#8e5bf5',n:'Purple'},{c:'#ee3b3b',n:'Merah'},{c:'#ff9a2e',n:'Oren'},{c:'#ffcb2e',n:'Kuning'},{c:'#2fb868',n:'Hijau'},{c:'#3a8dff',n:'Biru'},{c:'#fafafa',n:'Putih'},{c:'#2a2630',n:'Hitam'}];
var HAIRS=[{v:'pendek',l:'Pendek'},{v:'panjang',l:'Panjang'},{v:'tocang',l:'Tocang'},{v:'kerinting',l:'Kerinting'},{v:'tudung',l:'Tudung'}];
var OUTFITS=[{v:'baju-t',l:'Baju T'},{v:'baju-kurung',l:'Baju Kurung'},{v:'gaun',l:'Gaun'},{v:'overall',l:'Overall'}];
var SHOES=[{v:'sukan',l:'Kasut Sukan'},{v:'sekolah',l:'Kasut Sekolah'},{v:'sandal',l:'Sandal'},{v:'but',l:'But'}];
var PANTS=[{v:'pendek',l:'Seluar Pendek'},{v:'panjang',l:'Seluar Panjang'}];
var PEN=[{c:'#2a2020',n:'Hitam'},{c:'#ee3b3b',n:'Merah'},{c:'#ff9a2e',n:'Oren'},{c:'#ffcb2e',n:'Kuning'},{c:'#2fb868',n:'Hijau'},{c:'#3a8dff',n:'Biru'},{c:'#8e5bf5',n:'Purple'},{c:'#ff5fa8',n:'Pink'},{c:'#8a5a33',n:'Coklat'}];

/* fill: [ayat, jawapan betul, salah 1, salah 2] */

var AC=null;
function tone(freq,dur,type,when,vol){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(when||0);
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+(dur||.12));
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(dur||.12)+.03);
  }catch(e){}
}
var sfx={
  ok:function(){tone(660,.1,'triangle');tone(880,.18,'triangle',.1)},
  no:function(){tone(220,.22,'sawtooth',0,.07)},
  tap:function(){tone(520,.05,'sine',0,.07)},
  star:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.2,'triangle',i*.11)})}
};
var voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
var speechOK=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');
if(speechOK){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',function(){loadVoices();refreshVoiceHint()})}catch(e){}}
function malayVoice(){
  return voices.find(function(v){return /^ms/i.test(v.lang)})||voices.find(function(v){return /^id/i.test(v.lang)})||null;
}
function hasMalay(){return voices.some(function(v){return /^ms/i.test(v.lang)})}
function refreshVoiceHint(){
  var h=$('#vhint');if(!h)return;
  if(!speechOK){h.textContent='Peranti ini tidak menyokong suara, jadi butang Dengar tidak berfungsi.';h.hidden=false;return}
  if(!hasMalay()){h.textContent='Suara Bahasa Melayu mungkin tiada pada peranti ini. Butang Dengar boleh berbunyi lain atau senyap.';h.hidden=false}else h.hidden=true;
}
var curU=null;
function clearOn(){$$('.w.on').forEach(function(e){e.classList.remove('on')})}
function stopSpeak(){try{if(speechOK)speechSynthesis.cancel()}catch(e){}clearOn()}
function speak(text,opts){
  opts=opts||{};
  if(!speechOK)return false;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text),v=malayVoice();
    if(v){u.voice=v;u.lang=v.lang}else u.lang='ms-MY';
    u.rate=opts.rate||.82;u.pitch=1.1;
    if(opts.onboundary)u.onboundary=opts.onboundary;
    u.onend=u.onerror=function(){if(opts.onend)opts.onend()};
    curU=u;speechSynthesis.speak(u);return true;
  }catch(e){return false}
}

function walk(i,done){
  var seg=$('#seg'+i),walker=$('#walker');
  if(!seg||!walker){done();return}
  var len=seg.getTotalLength(),dur=reduceMotion?30:Math.max(1900,len*11),t0=null,tok=viewToken;
  function f(ts){
    if(tok!==viewToken)return;
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,pt=seg.getPointAtLength(len*e);
    walker.setAttribute('transform','translate('+(pt.x-20).toFixed(1)+' '+(pt.y-62).toFixed(1)+')');
    follow(pt.y);
    if(p<1)requestAnimationFrame(f);else done();
  }
  requestAnimationFrame(f);
}

/* --- 3. Mengira (tahap naik mengikut tempat) --- */
var math={i:0,qs:[]};
function mathLevel(pi){return pi<2?1:pi<4?2:pi<6?3:pi<8?4:5}
function mathQs(pi,set){
  var r=mulberry(pi*977+set*131+7),P=PLACES[pi],L=mathLevel(pi),m1=P.m1,m2=P.m2,g;
  var ri=function(lo,hi){return lo+Math.floor(r()*(hi-lo+1))};
  var a,b,x,y;
  if(L===1){a=ri(2,6);b=ri(1,4);x=ri(6,10);y=ri(1,x-3)}
  else if(L===2){a=ri(6,12);b=ri(3,8);x=ri(12,20);y=ri(3,x-6)}
  else if(L===3){a=ri(12,30);b=ri(6,20);x=ri(25,50);y=ri(8,x-10)}
  else if(L===4){a=ri(20,50);b=ri(10,40);x=ri(50,99);y=ri(10,x-15)}
  else{
    g=0;do{a=ri(35,68);b=ri(17,32);g++}while(g<50&&((a%10)+(b%10)<10||a+b>100));
    g=0;do{x=ri(61,99);y=ri(18,x-20);g++}while(g<50&&(x%10)>=(y%10));
  }
  var qs=[
    {t:'add',a:a,b:b,ans:a+b,e:m1.e,text:'Di '+P.name+', ada '+a+' '+m1.n+'. Kemudian ditambah '+b+' '+m1.n+' lagi. Berapakah jumlah '+m1.n+' sekarang?'},
    {t:'sub',x:x,y:y,ans:x-y,e:m2.e,text:'Di '+P.name+', ada '+x+' '+m2.n+'. Kemudian '+y+' '+m2.n+' telah '+m2.v+'. Berapakah '+m2.n+' yang tinggal?'}
  ];
  if(pi>=8){
    var p=ri(20,60),q=ri(10,30),s=ri(5,Math.min(30,p+q-10));
    qs.push({t:'mix',p:p,q:q,s:s,ans:p+q-s,e:m2.e,text:'Di '+P.name+', ada '+p+' '+m2.n+'. Kemudian ditambah '+q+' '+m2.n+' lagi. Selepas itu '+s+' '+m2.n+' telah '+m2.v+'. Berapakah '+m2.n+' yang tinggal?'});
  }
  return qs;
}
function emo(e,n,gone){
  if(n>12)return '<span class="em">'+e+'</span><span class="times">× '+n+'</span>';
  var s='';for(var i=0;i<n;i++){s+=gone&&i>=n-gone?'<span class="em gone"><i>'+e+'</i><b>✕</b></span>':'<span class="em">'+e+'</span>'}return s;
}
function task2(){math.qs=mathQs(S.placeIdx,curSet());math.i=0;mathRender()}
function mathRender(){
  var q=math.qs[math.i],total=math.qs.length,last=math.i===total-1,diagram,eq,L=mathLevel(S.placeIdx);
  if(q.t==='add'){
    diagram='<div class="grp">'+emo(q.e,q.a)+'</div><div class="op">+</div><div class="grp">'+emo(q.e,q.b)+'</div>';

    eq=q.x+' − '+q.y+' = ?';
  }else{
    diagram='<div class="grp">'+emo(q.e,q.p)+'</div><div class="op">+</div><div class="grp">'+emo(q.e,q.q)+'</div><div class="op">−</div><div class="grp">'+emo(q.e,q.s)+'</div>';
    eq=q.p+' + '+q.q+' − '+q.s+' = ?';
  }
  var cand=(L>=3?[q.ans-10,q.ans-1,q.ans+1,q.ans+10]:[q.ans-2,q.ans-1,q.ans+1,q.ans+2]).filter(function(v){return v>=0}),opts=shuffle([q.ans].concat(shuffle(cand).slice(0,2)));
  show(shell(
   '<div class="card"><div class="diagram" aria-hidden="true">'+diagram+'</div><p class="eq" aria-label="'+esc(eq)+'">'+eq+'</p>'+
   '<div class="qrow"><p class="q">'+esc(q.text)+'</p><button type="button" class="btn purple sm" id="listenQ" aria-label="Dengar soalan">'+ICON_SPEAK+'</button></div></div>'+
   '<div class="choices nums">'+opts.map(function(o){return '<button type="button" class="choice" data-v="'+o+'">'+o+'</button>'}).join('')+'</div>'+
   '<p class="fb" id="fb" role="status"></p><p class="hint" id="vhint" hidden></p>'+
   '<div class="dock"><button type="button" class="btn mint big" id="next" disabled>'+(last?'Seterusnya':'Soalan seterusnya')+'</button></div>',2,'Mari mengira ('+(math.i+1)+'/'+total+')'),'task');
  refreshVoiceHint();
  $('#listenQ').onclick=function(){speak(q.text)};
  $$('.choice').forEach(function(b){b.onclick=function(){
    var fb=$('#fb');
    if(+b.dataset.v===q.ans){

    }
  }});
  $('#next').onclick=function(){stopSpeak();if(last)goStep(3);else{math.i++;mathRender()}};

   '<button type="button" class="tbtn" id="eraser" aria-pressed="false">Pemadam</button><button type="button" class="tbtn" id="clear">Padam semua</button></div></div>'+
   '<p class="hint" id="dhint">Lukis sesuatu dahulu, kemudian tekan Selesai.</p>'+
   '<div class="dock"><button type="button" class="btn mint big" id="done" disabled>Selesai</button></div>',3,'Lukis sesuatu'),'task');
  var cv=$('#cv'),ctx=cv.getContext('2d'),color=PEN[0].c,size=16,erase=false,drawing=false,last=null,ink=false;
  ctx.lineCap='round';ctx.lineJoin='round';
  function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
  function setup(){ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=erase?size*2:size}
  function setInk(v){ink=v;$('#done').disabled=!v;$('#dhint').textContent=v?'Cantik! Tekan Selesai bila siap.':'Lukis sesuatu dahulu, kemudian tekan Selesai.'}
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    drawing=true;last=pos(e);setup();
    ctx.beginPath();ctx.arc(last.x,last.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();
    if(!erase&&!ink)setInk(true);
  });
  cv.addEventListener('pointermove',function(e){
    if(!drawing)return;e.preventDefault();
    var p=pos(e);setup();ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){cv.addEventListener(n,function(){drawing=false})});
  $$('.palette .sw').forEach(function(b){b.onclick=function(){
    color=b.dataset.c;erase=false;$('#eraser').setAttribute('aria-pressed','false');
    $$('.palette .sw').forEach(function(x){x.setAttribute('aria-pressed',x===b)});sfx.tap();
  }});
  $$('.tbtn[data-s]').forEach(function(b){b.onclick=function(){
    size=+b.dataset.s;$$('.tbtn[data-s]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});sfx.tap();
  }});
  $('#eraser').onclick=function(){erase=!erase;this.setAttribute('aria-pressed',erase);sfx.tap()};
  $('#clear').onclick=function(){ctx.clearRect(0,0,cv.width,cv.height);setInk(false);sfx.tap()};
  $('#done').onclick=function(){finishPlace()};
}

/* ================= star, finish ================= */
function finishPlace(){
  S.placeIdx++;S.atPlace=false;S.step=0;save();sfx.star();starScreen();
}
function starScreen(){
  hud(true);
  var n=S.placeIdx,done=PLACES[n-1],cols=['#ff5fa8','#8e5bf5','#ffc533','#2fb868','#3a8dff','#ff9a2e'],cf='';
  for(var i=0;i<16;i++)cf+='<i style="--x:'+(rand(94)+2)+'%;--c:'+cols[i%6]+';--d:'+(3+rand(30)/10)+'s;--dl:-'+(rand(40)/10)+'s"></i>';
  var bar='';for(var k=0;k<10;k++)bar+=starIcon(k<n);
  show('<div class="pane star-pane"><div class="conf" aria-hidden="true">'+cf+'</div><div class="bigstar" aria-hidden="true"><svg viewBox="0 0 120 120"><polygon points="'+starPoints(60,63,50,23)+'" fill="#ffc533" stroke="#ffc533" stroke-width="12" stroke-linejoin="round"/><polygon points="'+starPoints(60,63,36,16)+'" fill="#ffe27a"/></svg></div>'+
   '<h2>Bintang '+n+'!</h2><p>Hebat, '+esc(S.name)+'! Awak sudah siap di '+esc(done.name)+'.</p><div class="pbar" aria-hidden="true">'+bar+'</div>'+
   '<button type="button" class="btn big" id="onward">'+(n>=10?'Teruskan':'Pergi ke '+esc(PLACES[n].name))+'</button></div>','star');
  $('#onward').onclick=function(){sfx.tap();route()};
}
function congrats(){
  hud(true);
  show('<div class="congrats"><canvas class="fw" id="fw" aria-hidden="true"></canvas><div class="cg-body">'+avatarSVG(S.avatar,'dance')+
   '<h2>Tahniah, '+esc(S.name)+'!</h2><p>Awak sudah mengumpul 10 bintang dan sampai ke penghujung pengembaraan.</p><button type="button" class="btn big" id="redeem">Tebus Hadiah</button></div></div>','congrats');
  sfx.star();startFireworks($('#fw'));
  $('#redeem').onclick=function(){sfx.tap();redeem()};
}
function startFireworks(cv){
  var ctx=cv.getContext('2d'),W=0,H=0,parts=[],last=-1e9,side=0;
  function size(){var r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);W=r.width;H=r.height;ctx.setTransform(d,0,0,d,0,0)}
  size();
  var cols=['#ff5fa8','#b794ff','#ffc533','#4be3b0','#6cc6ff','#ff9a5a','#ffffff'];
  function burst(){
    var left=(side++%2===0),x=left?W*(.1+Math.random()*.16):W*(.74+Math.random()*.16),y=H*(.12+Math.random()*.34),c=cols[rand(cols.length)];
    for(var i=0;i<48;i++){var a=i/48*Math.PI*2,sp=1.4+Math.random()*2.6;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:c})}
  }
  if(reduceMotion){for(var k=0;k<6;k++){burst();}parts.forEach(function(p){p.x+=p.vx*14;p.y+=p.vy*14;p.l=.8;ctx.globalAlpha=.8;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.4,0,7);ctx.fill()});return}
  function frame(ts){
    if(!cv.isConnected)return;
    var r=cv.getBoundingClientRect();if(Math.abs(r.width-W)>2||Math.abs(r.height-H)>2)size();
    ctx.clearRect(0,0,W,H);
    if(ts-last>620){burst();last=ts}
    parts=parts.filter(function(p){return p.l>0});
    parts.forEach(function(p){
      p.vy+=.035;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.l-=.011;
      ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.6*p.l+.7,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function redeem(){
  var pick=null;
  show('<div class="pane"><h2>Pilih hadiah awak</h2><p>Tekan satu hadiah, kemudian tekan Tebus.</p><div class="gift-grid">'+
   GIFTS.map(function(g){return '<button type="button" class="gift" data-id="'+g.id+'" aria-pressed="false"><span class="ga">'+giftArt(g)+'</span><span>'+esc(g.name)+'</span></button>'}).join('')+
   '</div><button type="button" class="btn big" id="claim" disabled>Tebus Hadiah</button></div>','redeem');
  $$('.gift').forEach(function(b){b.onclick=function(){
    pick=b.dataset.id;sfx.tap();$$('.gift').forEach(function(x){x.setAttribute('aria-pressed',x===b)});$('#claim').disabled=false;
  }});
  $('#claim').onclick=function(){
    if(!pick)return;S.gifts.push(pick);S.giftPicked=true;save();sfx.star();reveal(pick);
  };
}
function reveal(id){
  hud(true);
  var g=GIFTS.find(function(x){return x.id===id})||GIFTS[0];
  var coll=S.gifts.length>1?'<div class="coll"><h2>Semua hadiah awak</h2><div class="grow">'+S.gifts.map(function(i){var x=GIFTS.find(function(y){return y.id===i});return x?'<div class="mini-gift" title="'+esc(x.name)+'">'+giftArt(x)+'</div>':''}).join('')+'</div></div>':'';
  show('<div class="pane reveal"><div class="glow">'+giftArt(g)+'</div><h2>Hadiah awak: '+esc(g.name)+'!</h2><p>Terima kasih kerana mengembara bersama bintang-bintang.</p>'+coll+
   '<button type="button" class="btn mint big" id="again">Main Lagi</button><button type="button" class="btn ghost" id="menu">Menu</button></div>','reveal');
  $('#again').onclick=function(){sfx.tap();S.placeIdx=0;S.atPlace=false;S.step=0;S.giftPicked=false;S.setIdx++;save();route()};
  $('#menu').onclick=function(){title()};
}

/* ================= init ================= */
$('#homeBtn').onclick=function(){sfx.tap();title()};
$('#sndBtn').onclick=function(){S.sound=!S.sound;save();hud(true);if(S.sound)sfx.tap()};
title();
})();
</script>
